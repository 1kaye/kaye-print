[package]
name = "kaye-print"
version = "1.0.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19"
gpui-kit = { version = "0.10.0", features = ["gpui-fast"] }
image = "0.25"
rfd = "0.15"
rust-i18n = "4.2"
tikv-jemallocator = "0.6"
tikv-jemalloc-sys = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
